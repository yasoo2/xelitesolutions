#  THE GATE THAT WAS NOT THERE.
#
#  Every quality workflow in this repository was suffixed `.disabled`, so the
#  only thing that ran on a push to `main` was the deploy. Type errors, failing
#  tests and known-vulnerable dependencies all had a clear path to production;
#  the checks existed and simply never ran.
#
#  This runs the checks the project already has and can pass today — the server
#  build, both type-checks, the whole Jest suite, and a dependency audit of what
#  actually ships. It reports on every push and every pull request, and the
#  deploy workflow now waits for it.
#
#  Deliberately NOT here: `web lint` as a blocking step. It is fixed in this
#  same change, but a gate whose first act is to fail on a pre-existing problem
#  gets switched off again within a week. It runs, it is visible, and it will be
#  made blocking once the warning count is zero.

name: CI — build, types, tests, audit

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:
  # Called by the deploy workflow as its gate — a deploy that has not passed
  # these checks does not run.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (api)
        run: npm --prefix api ci --no-audit --no-fund

      - name: Install (web)
        run: npm --prefix web ci --no-audit --no-fund

      - name: Type-check — api
        run: npm --prefix api run type-check --if-present || npx --prefix api tsc --noEmit -p api

      - name: Type-check — web
        run: npm --prefix web run type-check

      - name: Build — api
        run: npm --prefix api run build

      - name: Build — web
        run: npm --prefix web run build

      # The suite is the contract this project is built on: every guarantee it
      # has is written down here as a test that fails when the guarantee goes.
      - name: Test — api
        run: npm --prefix api test
        env:
          JWT_SECRET: ci-not-a-real-secret
          PERSISTENCE_MODE: JSON

      - name: Lint — web (reported, not yet blocking)
        run: npm --prefix web run lint
        continue-on-error: true

  # A GREEN JEST RUN IS NOT THE SAME FACT AS A WORKING SYSTEM.
  #
  #  Twice now a change has landed with the entire unit suite green and the
  #  live harnesses red — once because the tests had been legitimately
  #  repointed to the new contract while the harnesses still measured the whole
  #  path, and nobody ran them. That is exactly the gap these programs exist to
  #  cover: they boot the real thing, with real files and real processes, and
  #  they are the only checks that would have caught a build refusing to run on
  #  a workspace that already had projects in it.
  #
  #  Each baseline below is the number measured on this commit. They are
  #  asserted, not merely printed: a drop fails the job, and the number moves
  #  only by a deliberate edit here with a reason attached to it.
  live:
    name: Live harnesses (the system, actually running)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-not-a-real-secret
      PERSISTENCE_MODE: JSON
      ENABLE_AUTH_BYPASS: 'true'
      AUTO_APPROVE_ALL: '1'
    defaults:
      run:
        # Without pipefail a harness piped into `tee` reports tee's exit code,
        # so a red run would look green. The baseline greps below are the
        # second belt; this is the first.
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (api)
        run: npm --prefix api ci --no-audit --no-fund

      - name: The whole chain (baseline 38)
        working-directory: api
        run: npx ts-node -T src/tests/manual/verify_the_whole_chain.ts | tee /tmp/chain.log
      - name: …and it did not shrink
        run: grep -Eq '(^|[^0-9])(3[8-9]|[4-9][0-9]) passed' /tmp/chain.log

      - name: Every loop (baseline 55)
        working-directory: api
        run: npx ts-node -T src/tests/manual/verify_every_loop.ts | tee /tmp/loops.log
      - name: …and it did not shrink
        run: grep -Eq '(^|[^0-9])(5[5-9]|[6-9][0-9]) passed' /tmp/loops.log

      # The one that proves Joe still works when every provider is dead —
      # which is the state his machine is in every time a daily quota runs out.
      - name: Build without a brain (baseline 19)
        working-directory: api
        run: npx ts-node -T src/tests/manual/verify_build_without_a_brain.ts | tee /tmp/brain.log
      - name: …and it did not shrink
        run: grep -Eq '(^|[^0-9])(19|[2-9][0-9]) passed' /tmp/brain.log

      - name: It still builds on a crowded workspace (baseline 21)
        working-directory: api
        run: npx ts-node -T src/tests/manual/verify_it_still_builds.ts | tee /tmp/builds.log
      - name: …and it did not shrink
        run: grep -Eq '(2[1-9]|[3-9][0-9])/[0-9]+ checks passed' /tmp/builds.log

  audit:
    name: Dependency audit (what actually ships)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `--omit=dev` on purpose: a vulnerability in a build-time tool is worth
      # knowing about, but it is not the same fact as one in a package that runs
      # in production, and mixing the two is how audit output gets ignored.
      # WHY `critical` AND NOT `high` — MEASURED TWICE, NOT ASSUMED.
      #
      # One high advisory remains in the production tree: js-yaml, reachable
      # only through pm2. The obvious remedy is the one the advisory itself
      # names — pm2 7.0.3 — and it was installed and measured here:
      #
      #     pm2 6.0.14  →  1 high (js-yaml) + 1 moderate (pm2)
      #     pm2 7.0.3   →  2 high (js-yaml STILL, plus pm2 itself)
      #
      # The upgrade does not remove js-yaml and adds a high of its own, so
      # `fixAvailable` is wrong for this tree. The gate stays where the
      # evidence puts it. The unfiltered audit runs directly below, so the true
      # number is never hidden — only the blocking threshold is being argued,
      # and it moves the day pm2's own tree is clean.
      - name: Audit — api (production deps)
        run: npm --prefix api audit --omit=dev --audit-level=critical

      - name: Audit — api (full report, not blocking)
        run: npm --prefix api audit --omit=dev || true

      - name: Audit — web (full report, not blocking)
        run: npm --prefix web audit || true
