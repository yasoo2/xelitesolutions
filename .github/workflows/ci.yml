name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root and workspace dependencies
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix web ci
        env:
          CI: true

      - name: Lint (root)
        run: |
          npm run lint || echo "No lint script or lint warnings"

      - name: Typecheck (root)
        run: |
          npm run typecheck || echo "No typecheck script"

      - name: Build (root aggregate)
        run: |
          npm run build

      - name: API smoke tests
        run: |
          npm --prefix api run test:system || echo "API system tests skipped or failed (non-blocking)"
        env:
          JWT_SECRET: change-me

      - name: Web unit tests
        run: |
          npm --prefix web run test || echo "Web tests skipped or failed (non-blocking)"

      - name: Archive web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

