name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH port reachable
        shell: bash
        run: |
          set -euo pipefail
          host="${{ secrets.HOST }}"
          port="${{ secrets.PORT }}"
          host="$(printf '%s' "${host:-}" | tr -d '\r' | xargs)"
          port="$(printf '%s' "${port:-}" | tr -dc '0-9')"
          port="${port:-22}"
          if [ -z "${host:-}" ]; then
            echo "HOST secret is empty."
            exit 1
          fi
          echo "Testing TCP connectivity to ${host}:${port} ..."
          ok=0
          for i in $(seq 1 10); do
            if timeout 8 bash -lc "cat < /dev/null > /dev/tcp/${host}/${port}" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "TCP FAILED"
            exit 1
          fi
          echo "TCP OK"
          echo "Checking SSH banner on ${host}:${port} ..."
          banner="$(timeout 6 bash -lc "exec 3<>/dev/tcp/${host}/${port}; head -c 4 <&3" 2>/dev/null || true)"
          if [ "$banner" != "SSH-" ]; then
            echo "Not an SSH service on ${host}:${port} (banner_prefix='${banner}'). Check secrets.PORT."
            exit 1
          fi
          echo "SSH banner OK"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known_hosts
        shell: bash
        run: |
          set -euo pipefail
          host="${{ secrets.HOST }}"
          port="${{ secrets.PORT }}"
          host="$(printf '%s' "${host:-}" | tr -d '\r' | xargs)"
          port="$(printf '%s' "${port:-}" | tr -dc '0-9')"
          port="${port:-22}"
          if [ -z "${host:-}" ]; then
            echo "HOST secret is empty."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          tmp="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            out="$(ssh-keyscan -T 15 -p "$port" -t rsa,ecdsa,ed25519 -H "$host" 2>/dev/null || true)"
            if [ -n "${out:-}" ]; then
              printf '%s\n' "$out" >> "$tmp"
              break
            fi
            sleep 2
          done
          if [ ! -s "$tmp" ]; then
            echo "ssh-keyscan produced no output for ${host}:${port}. Check HOST/PORT and firewall."
            exit 1
          fi
          cat "$tmp" >> ~/.ssh/known_hosts
          rm -f "$tmp"
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Server
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "${HOST:-}" | tr -d '\r' | xargs)"
          user="$USERNAME"
          port="$(printf '%s' "${PORT:-}" | tr -dc '0-9')"
          port="${port:-22}"

          ssh_opts=(
            -p "$port"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o LogLevel=ERROR
          )

          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt}/3..."
            code=0
            ssh "${ssh_opts[@]}" "$user@$host" "DEPLOY_PATH='${DEPLOY_PATH:-}' bash -s" <<'REMOTE' || code=$?
          set -euo pipefail

          REPO_URL="https://github.com/yasoo2/xelitesolutions.git"
          REPO_HINT="yasoo2/xelitesolutions"
          BRANCH="main"

          bootstrap_repo_dir() {
            target_dir="$1"
            if [ ! -d "$target_dir" ]; then
              return 1
            fi
            cd "$target_dir" || return 1
            if [ -d ".git" ]; then
              return 0
            fi
            if [ -f "docker-compose.production.yml" ] || [ -f "docker-compose.server.yml" ] || [ -d "api" ] || [ -d "web" ]; then
              git init >/dev/null 2>&1 || return 1
              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin "$REPO_URL" >/dev/null 2>&1 || true
              else
                git remote add origin "$REPO_URL" >/dev/null 2>&1 || true
              fi
              git fetch --depth 1 origin "$BRANCH" || return 1
              git reset --hard "origin/$BRANCH" || return 1
              return 0
            fi
            return 1
          }

          DEPLOY_DIR="${DEPLOY_PATH:-}"

          if [ -n "${DEPLOY_DIR:-}" ] && [ -d "$DEPLOY_DIR" ]; then
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              if ! bootstrap_repo_dir "$DEPLOY_DIR"; then
                DEPLOY_DIR=""
              fi
            fi
          else
            DEPLOY_DIR=""
          fi

          if [ -z "${DEPLOY_DIR:-}" ]; then
            for d in /opt/joe /opt/xelitesolutions /var/www/joe /var/www/xelitesolutions /root/joe /root/xelitesolutions; do
              if [ -d "$d/.git" ]; then
                DEPLOY_DIR="$d"
                break
              fi
            done
          fi

          if [ -z "${DEPLOY_DIR:-}" ]; then
            for gitdir in $(find /opt /var/www /root -maxdepth 4 -type d -name .git 2>/dev/null); do
              parent_dir="$(dirname "$gitdir")"
              origin_url="$(git -C "$parent_dir" remote get-url origin 2>/dev/null || true)"
              if echo "$origin_url" | grep -q "$REPO_HINT"; then
                DEPLOY_DIR="$parent_dir"
                break
              fi
            done
          fi

          if [ -z "${DEPLOY_DIR:-}" ]; then
            BASE_DIR="/opt/joe"
            mkdir -p "$BASE_DIR"
            CLONE_DIR="$BASE_DIR"
            if [ -n "$(ls -A "$BASE_DIR" 2>/dev/null || true)" ] && [ ! -d "$BASE_DIR/.git" ]; then
              CLONE_DIR="$BASE_DIR/xelitesolutions"
              mkdir -p "$CLONE_DIR"
            fi

            if [ -d "$CLONE_DIR/.git" ]; then
              DEPLOY_DIR="$CLONE_DIR"
            elif bootstrap_repo_dir "$CLONE_DIR"; then
              DEPLOY_DIR="$CLONE_DIR"
            elif [ -z "$(ls -A "$CLONE_DIR" 2>/dev/null || true)" ]; then
              echo "Repo not found on server. Cloning into $CLONE_DIR ..."
              git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$CLONE_DIR" || {
                echo "Clone failed. Set secrets.DEPLOY_PATH to an existing repo path on the server." && exit 1
              }
              DEPLOY_DIR="$CLONE_DIR"
            else
              echo "Repo not found and target dir is not empty: $CLONE_DIR" && ls -la "$CLONE_DIR" && exit 1
            fi
          fi

          cd "$DEPLOY_DIR"
          if [ ! -d ".git" ]; then
            echo "Repo directory not found at: $DEPLOY_DIR. Set secrets.DEPLOY_PATH to the correct path." && exit 1
          fi

          echo "Working directory: $(pwd)"
          echo "Git syncing..."
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          echo "Deployed commit: $(git rev-parse --short HEAD)"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Neither 'docker compose' nor 'docker-compose' is available." && exit 1
          fi

          echo "Docker version:"
          docker version || true
          echo "Compose version:"
          $COMPOSE version || true

          if [ -f docker-compose.production.yml ] && [ -f /opt/joe/env/web.env ] && [ -f /opt/joe/env/api.env ] && [ -f /opt/joe/env/worker.env ]; then
            COMPOSE_FILE="docker-compose.production.yml"
          elif [ -f docker-compose.server.yml ] && [ -f ./env/web.env ]; then
            COMPOSE_FILE="docker-compose.server.yml"
          elif [ -f docker-compose.yml ]; then
            COMPOSE_FILE="docker-compose.yml"
          elif [ -f docker-compose.server.yml ]; then
            COMPOSE_FILE="docker-compose.server.yml"
            echo "Warning: ./env/web.env not found; compose may fail if env_file is required."
          elif [ -f docker-compose.production.yml ]; then
            COMPOSE_FILE="docker-compose.production.yml"
            echo "Warning: /opt/joe/env/*.env not found; compose may fail if env_file is required."
          else
            echo "No docker-compose file found in $(pwd)" && exit 1
          fi

          PROJECT_NAME="joe"
          echo "Using compose: $COMPOSE -p $PROJECT_NAME -f $COMPOSE_FILE"

          mkdir -p /opt/joe/certbot/conf /opt/joe/certbot/www
          if [ ! -f /opt/joe/certbot/conf/live/xelitesolutions.com/fullchain.pem ] || [ ! -f /opt/joe/certbot/conf/live/xelitesolutions.com/privkey.pem ]; then
            echo "TLS certificate not found. Bootstrapping Let's Encrypt..."
            COMPOSE_FILE="$COMPOSE_FILE" PROJECT_NAME="$PROJECT_NAME" CERTBOT_DATA_PATH="/opt/joe/certbot" ./init-letsencrypt.sh
          fi

          echo "Pre-clean potential name conflicts..."
          for n in joe_browser_worker joe_mongo joe_web joe_api joe_nginx joe_certbot; do
            ids="$(docker ps -aq --filter "name=$n" 2>/dev/null || true)"
            if [ -n "${ids:-}" ]; then
              docker rm -f $ids || true
            fi
          done
          
          echo "Docker building..."
          $COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" build --pull --no-cache
          echo "Docker restarting..."
          $COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans

          NGINX_CID="$($COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" ps -q nginx 2>/dev/null || true)"
          if [ -n "$NGINX_CID" ]; then
            echo "Nginx container: $NGINX_CID"
            docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$NGINX_CID" || true
            docker exec "$NGINX_CID" sh -lc 'nginx -t' || true
            docker exec "$NGINX_CID" sh -lc 'wget -qO- http://web:80/ 2>/dev/null | head -n 5' || true
          else
            echo "Warning: nginx container not found after deploy."
          fi

          WEB_CID="$($COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" ps -q web 2>/dev/null || true)"
          if [ -n "$WEB_CID" ]; then
            echo "Web container: $WEB_CID"
            docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$WEB_CID" || true
            docker exec "$WEB_CID" sh -lc 'ls -l /usr/share/nginx/html/index.html && sha256sum /usr/share/nginx/html/index.html | head -n 1' || true
          else
            echo "Warning: web container not found after deploy."
          fi

          if [ -n "$NGINX_CID" ] && [ -n "$WEB_CID" ]; then
            echo "Nginx last logs:"
            docker logs --tail 200 "$NGINX_CID" || true
            echo "Web last logs:"
            docker logs --tail 200 "$WEB_CID" || true
          fi

          echo "Waiting for ports 80/443 to become available..."
          ok80=0
          ok443=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1/ 2>/dev/null; then ok80=1; fi
            if curl -fkfsS -o /dev/null --max-time 2 https://127.0.0.1/ 2>/dev/null; then ok443=1; fi
            if [ "$ok80" -eq 1 ] && [ "$ok443" -eq 1 ]; then
              echo "Ports are ready."
              break
            fi
            sleep 2
          done

          if [ "$ok443" -ne 1 ]; then
            echo "HTTPS port 443 still not reachable on localhost."
            if [ -n "${NGINX_CID:-}" ]; then
              docker logs --tail 200 "$NGINX_CID" || true
            fi
            $COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" ps || true
            exit 1
          fi

          $COMPOSE -p "$PROJECT_NAME" -f "$COMPOSE_FILE" ps
          echo "Deployment finished!"
          REMOTE
            if [ "$code" -eq 0 ]; then
              echo "SSH deploy succeeded."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$code"
            fi
            sleep 5
          done

      - name: Verify Deployment
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://xelitesolutions.com/
          max-attempts: 12
          retry-delay: 10s
