name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -u

            REPO_URL="https://github.com/yasoo2/xelitesolutions.git"
            REPO_HINT="yasoo2/xelitesolutions"
            BRANCH="main"

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"

            if [ -n "${DEPLOY_DIR:-}" ] && [ -d "$DEPLOY_DIR/.git" ]; then
              :
            else
              DEPLOY_DIR=""
            fi

            if [ -z "${DEPLOY_DIR:-}" ]; then
              for d in /opt/joe /opt/xelitesolutions /var/www/joe /var/www/xelitesolutions /root/joe /root/xelitesolutions; do
                if [ -d "$d/.git" ]; then
                  DEPLOY_DIR="$d"
                  break
                fi
              done
            fi

            if [ -z "${DEPLOY_DIR:-}" ]; then
              for gitdir in $(find /opt /var/www /root -maxdepth 4 -type d -name .git 2>/dev/null); do
                parent_dir="$(dirname "$gitdir")"
                origin_url="$(git -C "$parent_dir" remote get-url origin 2>/dev/null || true)"
                if echo "$origin_url" | grep -q "$REPO_HINT"; then
                  DEPLOY_DIR="$parent_dir"
                  break
                fi
              done
            fi

            if [ -z "${DEPLOY_DIR:-}" ]; then
              DEPLOY_DIR="/opt/joe"
              mkdir -p "$DEPLOY_DIR"
              if [ ! -d "$DEPLOY_DIR/.git" ]; then
                echo "Repo not found on server. Cloning into $DEPLOY_DIR ..."
                git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$DEPLOY_DIR" || {
                  echo "Clone failed. Set secrets.DEPLOY_PATH to an existing repo path on the server." && exit 1
                }
              fi
            fi

            cd "$DEPLOY_DIR"
            if [ ! -d ".git" ]; then
              echo "Repo directory not found at: $DEPLOY_DIR. Set secrets.DEPLOY_PATH to the correct path." && exit 1
            fi

            echo "Working directory: $(pwd)"
            echo "Git syncing..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Deployed commit: $(git rev-parse --short HEAD)"

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              COMPOSE="docker compose"
            fi

            if [ -f docker-compose.production.yml ] && [ -f /opt/joe/env/web.env ] && [ -f /opt/joe/env/api.env ] && [ -f /opt/joe/env/worker.env ]; then
              COMPOSE_FILE="docker-compose.production.yml"
            elif [ -f docker-compose.server.yml ] && [ -f ./env/web.env ]; then
              COMPOSE_FILE="docker-compose.server.yml"
            elif [ -f docker-compose.yml ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f docker-compose.server.yml ]; then
              COMPOSE_FILE="docker-compose.server.yml"
              echo "Warning: ./env/web.env not found; compose may fail if env_file is required."
            elif [ -f docker-compose.production.yml ]; then
              COMPOSE_FILE="docker-compose.production.yml"
              echo "Warning: /opt/joe/env/*.env not found; compose may fail if env_file is required."
            else
              echo "No docker-compose file found in $(pwd)" && exit 1
            fi

            echo "Using compose: $COMPOSE -f $COMPOSE_FILE"
            echo "Docker building..."
            $COMPOSE -f "$COMPOSE_FILE" build --pull --no-cache web
            echo "Docker restarting..."
            $COMPOSE -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans web nginx
            WEB_CID="$($COMPOSE -f "$COMPOSE_FILE" ps -q web 2>/dev/null || true)"
            if [ -n "$WEB_CID" ]; then
              echo "Web container: $WEB_CID"
              docker inspect -f 'Image={{.Image}} Created={{.Created}}' "$WEB_CID" || true
              docker exec "$WEB_CID" sh -lc 'ls -l /usr/share/nginx/html/index.html && sha256sum /usr/share/nginx/html/index.html | head -n 1' || true
            else
              echo "Warning: web container not found after deploy."
            fi
            $COMPOSE -f "$COMPOSE_FILE" ps
            echo "Deployment finished!"

      - name: Verify Deployment
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://xelitesolutions.com/
          max-attempts: 3
          retry-delay: 5s
