name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        shell: bash
        env:
          HOST: ${{ secrets.SSH_HOST || secrets.HOST }}
          PORT: ${{ secrets.SSH_PORT || secrets.PORT || '22' }}
          USER: ${{ secrets.USERNAME || 'root' }}
        run: |
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -p "$PORT" "$USER@$HOST" "bash -s" << 'REMOTE'
          set -euo pipefail
          
          # Find project directory
          cd /root/xelitesolutions || exit 1
          
          echo "=== 1. Syncing latest code ==="
          git fetch origin main
          git reset --hard origin/main
          
          echo "=== 2. Cleaning up to free RAM ==="
          docker system prune -f --volumes || true
          # Clear OS cache
          sync && echo 3 > /proc/sys/vm/drop_caches || true
          
          echo "=== 3. Building Web Frontend ==="
          export NODE_OPTIONS="--max-old-space-size=2048"
          cd web
          npm ci --omit=dev 2>/dev/null || npm install --omit=dev
          npx vite build
          cd ..
          
          echo "=== 4. Building API (Sequential) ==="
          docker compose -f docker-compose.production.yml build api
          
          echo "=== 5. Building Web Container ==="
          docker compose -f docker-compose.production.yml build web
          
          echo "=== 6. Building Worker (Sequential) ==="
          docker compose -f docker-compose.production.yml build browser-worker
          
          echo "=== 7. Restarting all services ==="
          docker compose -p joe -f docker-compose.production.yml up -d --remove-orphans
          
          echo "=== 8. Final check ==="
          docker compose -p joe -f docker-compose.production.yml ps
          REMOTE
