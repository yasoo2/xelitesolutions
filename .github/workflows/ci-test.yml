name: CI - Test & Quality

on:
  push:
    branches: [ develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix api ci --no-audit --no-fund --include=dev
          npm --prefix web ci --no-audit --no-fund --include=dev

      - name: Lint API
        run: npm --prefix api run lint
        continue-on-error: true

      - name: Lint Web
        run: npm --prefix web run lint
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix api ci --no-audit --no-fund --include=dev
          npm --prefix web ci --no-audit --no-fund --include=dev

      - name: Run API Tests
        run: npm --prefix api run test
        continue-on-error: true

      - name: Run Web Tests
        run: npm --prefix web run test
        continue-on-error: true

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix api ci --no-audit --no-fund --include=dev
          npm --prefix web ci --no-audit --no-fund --include=dev

      - name: Build API
        run: npm --prefix api run build

      - name: Build Web
        run: npm --prefix web run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            api/dist
            web/dist
          retention-days: 7
          if-no-files-found: warn

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix api ci --no-audit --no-fund --include=dev
          npm --prefix web ci --no-audit --no-fund --include=dev

      - name: Generate coverage report
        run: |
          # Run tests with coverage (if scripts exist)
          if grep -q '"test:coverage"' api/package.json; then
            npm --prefix api run test:coverage
          fi
          if grep -q '"test:coverage"' web/package.json; then
            npm --prefix web run test:coverage
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
