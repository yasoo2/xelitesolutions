server {
    listen 80;
    server_name xelitesolutions.com www.xelitesolutions.com api.xelitesolutions.com browser.xelitesolutions.com ws.xelitesolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xelitesolutions.com www.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase body size for file uploads
        client_max_body_size 50M;
    }
}

server {
    listen 443 ssl;
    server_name ws.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Prevent timeout for long websocket sessions
    }
}

server {
    listen 443 ssl;
    server_name browser.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://joe_browser_worker:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Prevent timeout
    }
}
