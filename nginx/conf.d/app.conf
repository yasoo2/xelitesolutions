server {
    listen 80;
    server_name xelitesolutions.com www.xelitesolutions.com api.xelitesolutions.com browser.xelitesolutions.com ws.xelitesolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xelitesolutions.com www.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    location /ws {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /browser/ws/ {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~ ^/(auth|tools|runs|run|sessions|folders|files|approvals|project|audio|assets|memory|knowledge|system|insta|providers|artifacts)(/|$) {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    location / {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        
        # Increase body size for file uploads
        client_max_body_size 50M;
    }
}

server {
    listen 443 ssl;
    server_name ws.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    location / {
        set $api_ws_upstream api:3000;
        proxy_pass http://$api_ws_upstream;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Prevent timeout for long websocket sessions
    }
}

server {
    listen 443 ssl;
    server_name browser.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    location / {
        set $browser_upstream joe_browser_worker:8080;
        proxy_pass http://$browser_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Prevent timeout
    }
}
