resolver 127.0.0.11 valid=5s;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream api_upstream {
    zone api_upstream 64k;
    server 172.18.0.1:5000;
}

# ═══════════════════════════════════════════════
# GZIP COMPRESSION
# ═══════════════════════════════════════════════
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    font/opentype
    font/ttf
    font/woff
    font/woff2
    image/svg+xml;

# ═══════════════════════════════════════════════
# HTTP -> HTTPS Redirect
# ═══════════════════════════════════════════════
server {
    listen 80;
    server_name xelitesolutions.com www.xelitesolutions.com api.xelitesolutions.com browser.xelitesolutions.com ws.xelitesolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════
# MAIN HTTPS SERVER
# ═══════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name xelitesolutions.com www.xelitesolutions.com;

    ssl_certificate /etc/letsencrypt/live/xelitesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xelitesolutions.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ═══ Security Headers ═══
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ═══ Static Assets ═══
    location / {
        proxy_pass http://joe_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══ WebSocket & API (Unified) ═══
    # This matches /ws, /api/ws, /api/runs/start, etc.
    location ~ ^/(api|ws|auth|tools|runs|run|sessions|folders|files|approvals|project|audio|memory|knowledge|system|insta|providers|artifacts|health|debug)(/|$) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 100M;
    }

    # ═══ Preview Proxy ═══
    location ~ ^/preview/(?<p_port>\d+)/ {
        proxy_pass http://172.18.0.1:$p_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
