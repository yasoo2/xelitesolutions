services:
  mongo:
    image: mongo:7
    container_name: joe_mongo
    restart: always
    command: [ "mongod", "--wiredTigerCacheSizeGB", "0.25" ]
    mem_limit: 512m
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - joe-network
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # API runs directly on host (not in Docker) due to native module glibc incompatibility
  # Start API with: /root/start_api.sh

  web:
    build:
      context: ../web
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: joe_web
    restart: always
    mem_limit: 128m
    env_file:
      - .env
    environment: {}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - joe-network

  browser-worker:
    build:
      context: ../services/joe-browser-worker
      dockerfile: Dockerfile
    container_name: joe_browser_worker
    restart: always
    mem_limit: 512m
    environment:
      - PORT=7070
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7070/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - joe-network
    # NO `ports:` HERE, DELIBERATELY.
    #
    # This block used to publish "5050:5050" and "7070:7070", which binds to
    # every interface on the host — while mongo and ollama in this same file
    # are carefully bound to 127.0.0.1. 5050 is the Chromium control socket:
    # anyone who can reach it can drive a real browser with no credential at
    # all, visit internal addresses through it, and act inside whatever session
    # that browser holds.
    #
    # Nothing outside the compose network needs either port. The API reaches
    # the worker by service name over `joe-network`
    # (BROWSER_WS_ENDPOINT=ws://browser-worker:5050/ws) and nginx does not
    # proxy it. For local debugging, bind explicitly to the loopback —
    # "127.0.0.1:7070:7070" — never to 0.0.0.0.

  nginx:
    image: nginx:alpine
    container_name: joe_nginx
    restart: always
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
      - browser-worker
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    mem_limit: 64m
    volumes:
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ============================================================================
  # Ollama - self-hosted KEYLESS brain. Runs the open model that powers Joe with
  # NO API key and NO per-request limits. The pulled model persists in
  # ./data/ollama so it survives restarts and moves with the deployment.
  # The API (on host) reaches it via LOCAL_LLM_BASE_URL=http://localhost:11434/v1
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: joe_ollama
    restart: always
    mem_limit: 8g
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - joe-network
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # One-shot: pull the model on first deploy so the AI is ready automatically.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: joe_ollama_pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: [ "/bin/sh", "-c", "sleep 8; ollama pull ${LOCAL_LLM_MODEL:-llama3.1:8b}; echo 'ollama model ready'" ]
    networks:
      - joe-network
    restart: "no"

volumes:
  mongo_data:
  lance_data:
  deep_memory:


networks:
  joe-network:
    name: joe-network
    driver: bridge
