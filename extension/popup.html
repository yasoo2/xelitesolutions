<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0b0f14; color: #e6edf3; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { font-size: 12px; color: #9aa4b2; margin: 0 0 12px; line-height: 1.5; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 10px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .on { background: #22c55e; } .off { background: #ef4444; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
    a { color: #4c9ffe; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🧩 Joe Browser Connector</h1>
  <p>يربط متصفحك الحقيقي بنظام جو ليتصرّف في متصفحك بحساباتك بعد موافقتك.</p>
  <div class="status"><span id="dot" class="dot off"></span><span id="label">غير متصل</span></div>
  <button id="open">افتح جو للاتصال</button>
  <p style="margin-top:12px">افتح جو وسجّل دخولك، وسيتصل تلقائياً. أبقِ تبويب جو مفتوحاً.</p>
  <script src="popup.js"></script>
</body>
</html>
