services:
  mongo:
    image: mongo:7
    container_name: joe_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - joe-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: joe_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "node /app/healthcheck.js" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - lance_data:/app/data
      - deep_memory:/app/.gemini
    networks:
      - joe-network
    depends_on:
      mongo:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: joe_dashboard
    restart: always
    env_file:
      - .env
    networks:
      - joe-network

  web:
    build:
      context: ./web
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: joe_web
    restart: always
    env_file:
      - .env
    networks:
      - joe-network
    depends_on:
      api:
        condition: service_healthy

  browser-worker:
    build: ./services/joe-browser-worker
    container_name: joe_browser_worker
    restart: always
    environment:
      - PORT=7070
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - joe-network
    deploy:
      resources:
        limits:
          memory: 4G

  nginx:
    image: nginx:alpine
    container_name: joe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe-network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: joe_certbot
    volumes:
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
  lance_data:
  deep_memory:


networks:
  joe-network:
    name: joe-network
    driver: bridge
