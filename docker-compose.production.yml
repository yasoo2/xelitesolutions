services:
  mongo:
    image: mongo:latest
    container_name: joe_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - joe-network

  api:
    build: ./api
    container_name: joe_api
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/joe
      - PORT=3000
      - JWT_SECRET=prod_secret_73821038_secure_key
      - BROWSER_WS_ENDPOINT=ws://browser-worker:5050/ws
      - WORKER_API_KEY=joe_secret_browser_key
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - joe-network
    depends_on:
      - mongo

  web:
    build: ./web
    container_name: joe_web
    restart: always
    environment:
      #- VITE_API_URL=https://api.xelitesolutions.com
      - NODE_ENV=production
    networks:
      - joe-network

  browser-worker:
    build: ./services/joe-browser-worker
    container_name: joe_browser_worker
    restart: always
    environment:
      - PORT=7070
      - WORKER_API_KEY=joe_secret_browser_key
    networks:
      - joe-network
    deploy:
      resources:
        limits:
          memory: 4G

  nginx:
    image: nginx:alpine
    container_name: joe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe-network
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: joe_certbot
    volumes:
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - joe-network

volumes:
  mongo_data:


networks:
  joe-network:
    driver: bridge
