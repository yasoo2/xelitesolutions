server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for config.js
    location = /config.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    # Proxy API requests to backend
    location /api/ {
        # Rewrite /api/foo -> /foo if backend expects that, OR keep /api if backend uses /api router.
        # Looking at index.ts, routes are mounted directly e.g. app.use('/system'...).
        # BUT useAgent calls /run/start without /api prefix? 
        # Wait, useAgent.ts: `${API_URL}/runs/start`.
        # If API_URL is '/api', then request is '/api/runs/start'.
        # Backend listens on root?
        # api/src/index.ts: app.use('/api/browser', browserRoutes);
        # mostly mounts on root.
        # So we should rewrite /api/ to /
        
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
