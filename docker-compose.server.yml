services:
  mongo:
    image: mongo:7
    container_name: joe_mongo
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
    networks: [joe_net]

  api:
    image: node:20-alpine
    container_name: joe_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/joe
      - BROWSER_WORKER_URL=http://joe_browser_worker:8080
    command: sh -lc "npm ci --include=dev && npm run build && npm run start"
    depends_on: [mongo]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [joe_net]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: joe-web:latest
    container_name: joe_web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"
    networks: [joe_net]
    env_file:
      - ./env/web.env

  browser_worker:
    build:
      context: ./services/joe-browser-worker
      dockerfile: Dockerfile
    image: joe-browser-worker:latest
    container_name: joe_browser_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HEADLESS=false
    networks: [joe_net]
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: joe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    networks:
      - joe_net
    depends_on:
      - api
      - web
      - browser_worker
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: joe_certbot
    volumes:
      - /opt/joe/certbot/conf:/etc/letsencrypt
      - /opt/joe/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - joe_net

networks:
  joe_net:
    driver: bridge
