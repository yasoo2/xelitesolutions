plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.joe.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.joe.phone'
        // Android 8 and newer: almost every phone and tablet in use.
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the build's own debug key until Joe has a release key of its own.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The one library: a WebSocket to Joe that survives the phone's network changes.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
