<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe API | Diagnostic Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="dark-mode">
    <div class="glass-container">
        <header>
            <div class="logo">
                <span class="icon">🚀</span>
                <h1>Joe Diagnostic Suite</h1>
            </div>
            <div id="status-badge" class="badge">Checking...</div>
        </header>

        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <span class="label">Database</span>
                    <span id="db-status" class="value">...</span>
                </div>
                <div class="stat-card">
                    <span class="label">Uptime</span>
                    <span id="uptime" class="value">...</span>
                </div>
                <div class="stat-card">
                    <span class="label">Environment</span>
                    <span id="env" class="value">...</span>
                </div>
                <div class="stat-card">
                    <span class="label">Version</span>
                    <span class="value">1.1.0-prod</span>
                </div>
            </section>

            <section class="actions">
                <a href="test.html" class="btn primary">Open Playground</a>
                <button onclick="fetchHealth()" class="btn secondary">Refresh Stats</button>
            </section>

            <section class="manifest">
                <h3>System Manifest</h3>
                <pre id="manifest-content">Loading structure.txt...</pre>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 xElite Solutions | Secure Agentic Infrastructure</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
