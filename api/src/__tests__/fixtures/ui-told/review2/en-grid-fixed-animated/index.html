<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1f2937;background:#fff}main{padding:16px}@keyframes fadeInUp{from{opacity:0;transform:translate3d(0,40px,0)}to{opacity:1;transform:translate3d(0,0,0)}}.animate__fadeInUp{animation:fadeInUp .2s both}.grid{display:grid;grid-template-columns:repeat(4,180px);gap:16px}.card{border:1px solid #e5e7eb;border-radius:10px;padding:12px}button{min-height:40px}</style></head><body><main><h1>Shop</h1><div class="grid"><div class="card animate__fadeInUp"><h3>Mug</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Tote</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Cap</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Socks</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Pen</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Sticker</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Notebook</h3><p>$12</p><button>Add to cart</button></div><div class="card animate__fadeInUp"><h3>Lamp</h3><p>$12</p><button>Add to cart</button></div></div></main></body></html>
