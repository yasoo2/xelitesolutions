<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Sales 2026</h1><canvas id="c" width="800" height="240"></canvas><p>Chart: monthly revenue.</p></main><script>const c=document.getElementById('c').getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,800,240);c.font='14px sans-serif';['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].forEach((m,i)=>{c.fillStyle='#2563eb';c.fillRect(20+i*64,200-(i*13+40),40,i*13+40);c.fillStyle='#111';c.fillText(m,24+i*64,225);});</script></body></html>
