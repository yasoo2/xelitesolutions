<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe API | Playground</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="dark-mode">
    <div class="glass-container wider">
        <header>
            <div class="logo">
                <a href="index.html" class="back-link">←</a>
                <h1>API Playground</h1>
            </div>
        </header>

        <main class="playground-layout">
            <div class="request-panel">
                <div class="form-group">
                    <label>Endpoint</label>
                    <input type="text" id="endpoint" value="/health" placeholder="/api/...">
                </div>
                <div class="form-group">
                    <label>Payload (JSON)</label>
                    <textarea id="body" placeholder='{"action": "test"}'></textarea>
                </div>
                <button onclick="runTest()" class="btn primary full-width">Execute Request</button>

                <div class="short-cuts">
                    <label>Shortcuts:</label>
                    <div class="chips">
                        <span onclick="setFields('/health', '')">Health</span>
                        <span onclick="setFields('/api/tools/terminal_manager/execute', '{\" action\":\"list\"}')">List
                            Terminals</span>
                        <span onclick="setFields('/api/workspaces', '')">Workspaces</span>
                    </div>
                </div>
            </div>

            <div class="response-panel">
                <label>Output</label>
                <pre id="result">Waiting for execution...</pre>
            </div>
        </main>
    </div>

    <script>
        function setFields(ep, body) {
            document.getElementById('endpoint').value = ep;
            document.getElementById('body').value = body;
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
