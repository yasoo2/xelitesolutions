<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vivos Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Vivos — متجر إلكتروني</h1>
    <input id="search" placeholder="ابحث عن منتج..." />
    <select id="category"></select>
    <button id="refresh">تحديث</button>
    <div class="cart-indicator" id="cartCount">0</div>
  </header>
  <main>
    <section id="grid" class="grid"></section>
    <aside class="cart">
      <h2>السلة</h2>
      <div id="cartItems"></div>
      <button id="checkout">اتمام الطلب</button>
      <div id="orderStatus"></div>
      <h2>المفضلة</h2>
      <div id="wishlist"></div>
      <button id="ordersBtn">عرض الطلبات</button>
      <div id="orders"></div>
    </aside>
  </main>
  <script src="app.js"></script>
  </body>
  </html>
